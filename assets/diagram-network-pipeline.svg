<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="auto" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e40af" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="840" height="260" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Stage 1: Ingress Packet -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="160" height="216" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="28" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace">01. INGRESS PACKET</text>
    
    <text x="12" y="48" font-size="9.5" font-weight="600" fill="#475569" font-family="'JetBrains Mono', Consolas, monospace">IPv4 Frame Header</text>
    <rect x="12" y="56" width="136" height="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="18" y="70" font-size="8.5" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">Ver:4 | IHL:5 | ToS:0</text>
    
    <rect x="12" y="80" width="136" height="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="18" y="94" font-size="8.5" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">Total Len: 64 bytes</text>
    
    <rect x="12" y="104" width="136" height="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="18" y="118" font-size="8.5" font-weight="600" fill="#1e40af" font-family="'JetBrains Mono', Consolas, monospace">TTL: 64 | Proto: ICMP/UDP</text>
    
    <rect x="12" y="128" width="136" height="20" fill="#fef3c7" stroke="#fde68a"/>
    <text x="18" y="142" font-size="8.5" font-weight="600" fill="#92400e" font-family="'JetBrains Mono', Consolas, monospace">Checksum: 0x4B3A</text>
    
    <rect x="12" y="152" width="136" height="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="18" y="166" font-size="8.5" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">Src: 10.0.1.50</text>
    
    <rect x="12" y="176" width="136" height="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="18" y="190" font-size="8.5" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">Dst: 192.168.10.1</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="178" y1="130" x2="218" y2="130" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 2: Checksum Verification -->
  <g transform="translate(224, 22)">
    <rect x="0" y="0" width="175" height="216" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="28" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace">02. RFC 1071 ENGINE</text>
    
    <text x="12" y="48" font-size="9" font-weight="600" fill="#475569">Verification Algorithm</text>
    <text x="12" y="65" font-size="8.5" fill="#334155">• 16-bit 1's complement sum</text>
    <text x="12" y="80" font-size="8.5" fill="#334155">• Carry-fold into lower bits</text>
    <text x="12" y="95" font-size="8.5" fill="#334155">• Bitwise NOT inversion</text>
    
    <rect x="10" y="108" width="155" height="42" rx="2" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="16" y="124" font-size="8.5" font-weight="600" fill="#065f46" font-family="'JetBrains Mono', Consolas, monospace">Sum == 0xFFFF (VALID)</text>
    <text x="16" y="139" font-size="8" fill="#047857">Corrupt packets dropped</text>
    
    <rect x="10" y="156" width="155" height="48" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="16" y="172" font-size="8.5" font-weight="600" fill="#1e40af" font-family="'JetBrains Mono', Consolas, monospace">RFC 1624 Incremental Update:</text>
    <text x="16" y="188" font-size="8" fill="#1e3a8a" font-family="'JetBrains Mono', Consolas, monospace">HC' = ~(~HC + ~m + m')</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="399" y1="130" x2="435" y2="130" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 3: Control Plane & Mitigation -->
  <g transform="translate(440, 22)">
    <rect x="0" y="0" width="180" height="216" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="28" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="18" font-size="11" font-weight="600" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace">03. CoPP &amp; MITIGATION</text>
    
    <text x="12" y="48" font-size="9" font-weight="600" fill="#475569">Inspection &amp; Rate Limits</text>
    
    <rect x="10" y="58" width="160" height="44" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="74" font-size="8.5" font-weight="600" fill="#0f172a">CoPP Policy Map:</text>
    <text x="16" y="89" font-size="8" fill="#64748b">• ICMP Echo: Policed @ 50 pps</text>
    
    <rect x="10" y="108" width="160" height="44" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="124" font-size="8.5" font-weight="600" fill="#0f172a">TCP SYN Flooding Check:</text>
    <text x="16" y="139" font-size="8" fill="#64748b">• SYN cookie / Half-open limit</text>
    
    <rect x="10" y="158" width="160" height="44" rx="2" fill="#fef2f2" stroke="#fecaca"/>
    <text x="16" y="174" font-size="8.5" font-weight="600" fill="#991b1b">Remotely Triggered Black Hole:</text>
    <text x="16" y="189" font-size="8" fill="#b91c1c" font-family="'JetBrains Mono', Consolas, monospace">RTBH → Null0 (BGP Trigger)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="620" y1="130" x2="654" y2="130" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 4: Egress / VLSM Routing -->
  <g transform="translate(660, 22)">
    <rect x="0" y="0" width="162" height="216" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="162" height="28" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="18" font-size="11" font-weight="600" fill="#0f172a" font-family="'JetBrains Mono', Consolas, monospace">04. VLSM ROUTING</text>
    
    <text x="10" y="48" font-size="9" font-weight="600" fill="#475569">FIB Prefix Lookup</text>
    
    <rect x="8" y="58" width="146" height="34" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="72" font-size="8" font-weight="600" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">192.168.10.0/24 (VLAN 10)</text>
    <text x="14" y="84" font-size="7.5" fill="#64748b">Engineering Subnet</text>
    
    <rect x="8" y="98" width="146" height="34" rx="2" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="14" y="112" font-size="8" font-weight="600" fill="#334155" font-family="'JetBrains Mono', Consolas, monospace">10.0.1.0/30 (P2P WAN)</text>
    <text x="14" y="124" font-size="7.5" fill="#64748b">Serial Link [2 Hosts, 0 Waste]</text>
    
    <rect x="8" y="140" width="146" height="64" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="14" y="156" font-size="8" font-weight="600" fill="#1e40af">Address Optimization:</text>
    <text x="14" y="172" font-size="12" font-weight="700" fill="#1e3a8a">88.28%</text>
    <text x="14" y="188" font-size="7.5" fill="#475569">Overall Subnet Efficiency</text>
  </g>
</svg>